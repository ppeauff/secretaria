<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPEA</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fundo-topo:  #0d3d47;
    --fundo-base:  #06181d;
    --brilho:      rgba(122, 214, 199, 0.18);
    --tinta:       #ffffff;
    --tinta-suave: #8fbfc4;
    --fio:         rgba(143, 191, 196, 0.35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    background: linear-gradient(170deg, var(--fundo-topo) 0%, var(--fundo-base) 70%);
    font-family: 'Archivo', system-ui, -apple-system, sans-serif;
    color: var(--tinta);
    /* o brilho suave atrás do logo */
    background-attachment: fixed;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 42%, var(--brilho) 0%, transparent 55%);
    pointer-events: none;
  }

  .marca {
    position: relative;
    text-align: center;
    animation: entrada 1.1s cubic-bezier(0.2, 0.7, 0.3, 1) both;
  }

  .marca img {
    width: clamp(180px, 42vw, 320px);
    height: auto;
    display: block;
    margin: 0 auto;
  }

  .marca h1 {
    margin-top: 1.75rem;
    font-size: clamp(2.5rem, 11vw, 4.5rem);
    font-weight: 700;
    letter-spacing: 0.22em;
    /* compensa o espaçamento à direita da última letra */
    text-indent: 0.22em;
    line-height: 1;
  }

  .fio {
    width: clamp(70px, 18vw, 120px);
    height: 1px;
    margin: 1.5rem auto 0;
    background: var(--fio);
    transform-origin: center;
    animation: risco 1.2s 0.5s cubic-bezier(0.2, 0.7, 0.3, 1) both;
  }

  @keyframes entrada {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes risco {
    from { transform: scaleX(0); opacity: 0; }
    to   { transform: scaleX(1); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .marca, .fio { animation: none; }
  }
</style>
</head>
<body>

  <main class="marca">
    <img src="logo.svg" alt="Logo do PPEA">
    <h1>PPEA</h1>
    <div class="fio"></div>
  </main>

</body>
</html>
